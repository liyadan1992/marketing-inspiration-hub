function navigate(){const [name,mode]=location.hash.slice(1).split('/');if(name==='main')return;view=Object.prototype.hasOwnProperty.call(sections,name)?name:'home';homeMode=['latest','unread'].includes(mode)?mode:'featured';source=kind=state='all';if(view==='home'&&homeMode==='unread')state='unread';filterOpen=false;query='';limit=12;$('search').value='';$('sources').open=false;render();window.scrollTo({top:0,behavior:'instant'})}

$('search').addEventListener('input',e=>applySearch(e.target.value));$('clear-search').onclick=()=>{$('search').value='';applySearch('');$('search').focus()};$('kind').onchange=e=>{kind=e.target.value;limit=12;render()};$('state').onchange=e=>{state=e.target.value;limit=12;render()};$('load-more').onclick=()=>{const previousLimit=limit;limit+=12;render();const firstNew=$('list').children[previousLimit]?.querySelector('h2 a');firstNew?.focus({preventScroll:true})};window.addEventListener('hashchange',navigate);
function exportRecords(){try{const records={},unreadableKeys=[];for(const k of [key,caseKey,...legacyKeys]){try{records[k]=localStorage.getItem(k)}catch{records[k]=null;unreadableKeys.push(k)}}const backup={format:'marketing-library-backup',version:2,exportedAt:new Date().toISOString(),unreadableKeys,currentReader:prefs,caseNotes,originalRecords:records};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='营销灵感库-学习记录-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(unreadableKeys.length?'已导出当前记录；部分旧记录因浏览器权限无法读取':'已导出学习记录与案例拆解笔记')}catch{toast('导出失败，请先复制需要保留的笔记。')}}
document.querySelector('.brand').onclick=()=>{if(location.hash==='#home')navigate()};
$('export-data').onclick=exportRecords;$('mobile-export').onclick=exportRecords;

function renderReadingBar(){
 const home=view==='home'&&!query;
 $('reading-bar').hidden=!home;
 document.querySelectorAll('[data-mode]').forEach(a=>{if(a.dataset.mode===homeMode)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 $('content-filters').hidden=home&&!filterOpen;
 $('filter-toggle').setAttribute('aria-expanded',String(filterOpen));
}
function motif(section){
 const shapes={
 inspiration:'<path d="M59 6A48 48 0 0 0 59 102V6Z" fill="currentColor"/><circle cx="48" cy="89" r="23" fill="var(--tone)"/><path d="m60 92 25 25H60Z" fill="currentColor"/><path d="m62 72 29-29M69 43h22v22" stroke="var(--ink)" stroke-width="2" fill="none"/>',
 xhs:'<path d="M51 51v62h43V51a62 62 0 0 0-43 62" fill="currentColor"/><path d="M36 7v47M13 30h46M20 14l32 32M20 46l32-32" stroke="currentColor" stroke-width="5" fill="none"/>',
 health:'<path d="M9 51C9 22 27 8 55 8C55 37 36 51 9 51Z" fill="currentColor"/><path d="M9 59h80v50H9Z" fill="currentColor" opacity=".45"/><path d="M9 59a50 50 0 0 1 50 50H9Z" fill="currentColor"/>',
 community:'<circle cx="36" cy="54" r="29" stroke="currentColor" stroke-width="5" fill="none"/><circle cx="65" cy="54" r="29" stroke="currentColor" stroke-width="5" fill="none"/>'};
 const parser=new DOMParser();const svg=parser.parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">'+(shapes[section]||'')+'</svg>','image/svg+xml').documentElement;
 svg.setAttribute('class','motif');svg.setAttribute('aria-hidden','true');return document.importNode(svg,true);
}
function categoryLabel(section){const a=node('a',null,'category-label');a.href='#'+section;a.append(icon(sections[section].icon),document.createTextNode(sections[section].title));return a}
function makeFeature(item,area){
 const card=makeEntry(item);card.classList.add('feature','home-'+area);
 card.querySelector('.learning-progress')?.remove();
 const heading=card.querySelector('h2'),topics=card.querySelector('.topics'),footer=card.querySelector('.entry-footer'),bookmark=card.querySelector('.bookmark'),access=card.querySelector('.access');
 const meta=node('p',item.source+' · '+(item.date||'入口核验 '+item.verifiedAt),'feature-meta');
 card.replaceChildren(motif(item.section),categoryLabel(item.section),heading,topics,meta);
 if(access)card.append(access);
 const open=item.section==='xhs'?node('a','在本站看案例'):externalLink(item.section==='community'?'阅读案例':learning(item)?'开始学习':item.section==='health'?'阅读观察':'阅读原文',item.url);if(item.section==='xhs')open.href='#xhs';open.className='open-reading'+(item.section==='inspiration'?' primary':'');footer.prepend(open);footer.append(bookmark);card.append(footer);return card;
}
function makeCaseFeature(){const card=node('article',null,'entry feature home-community theme-community');card.append(motif('community'),categoryLabel('community'),node('h2','和 AI 对话，拆解一个真实营销案例'));const topics=node('div',null,'topics');topics.append(node('span','引导提问'),node('span','结构化笔记'));card.append(topics,node('p',caseNotes.length?'已有 '+caseNotes.length+' 篇个人拆解笔记':'从一个工作中真正想解决的问题开始','feature-meta'));const footer=node('div',null,'entry-footer'),open=node('a','开始拆解','open-reading');open.href='#community';open.append(icon('arrow'));footer.append(open);card.append(footer);return card}
function compactReport(item){
 const card=makeEntry(item),originalHeading=card.querySelector('h2'),summary=card.querySelector('.summary'),footer=card.querySelector('.entry-footer'),bookmark=card.querySelector('.bookmark'),heading=node('h3');heading.append(...originalHeading.childNodes);
 card.replaceChildren(heading);if(summary)card.append(summary);card.append(node('div',item.source+' · '+item.date+' · '+item.access,'meta'));footer.append(bookmark);card.append(footer);return card;
}
function renderOverview(){
 const list=$('list');list.className='home-grid';list.replaceChildren();
 const pick=section=>items.find(a=>a.section===section);
 const marketing=pick('inspiration'),xhs=pick('xhs');
 if(marketing)list.append(makeFeature(marketing,'marketing'));
 if(xhs)list.append(makeFeature(xhs,'ai'));else{const card=node('article',null,'entry feature home-ai theme-xhs');card.append(motif('xhs'),categoryLabel('xhs'),node('h2','寻找值得拆解的小红书营销案例'));const topics=node('div',null,'topics');topics.append(node('span','优秀广告'),node('span','营销分析'),node('span','行业案例'));card.append(topics,node('p','核对原帖后收录，并记录创意亮点与可借鉴点。','feature-meta'));const foot=node('div',null,'entry-footer'),link=node('a','查看案例栏目','open-reading');link.href='#xhs';foot.append(link);card.append(foot);list.append(card)}
 const reportBox=node('section',null,'home-reports theme-reports'),head=node('div',null,'home-reports-head'),title=node('h2');title.append(icon('report'),document.createTextNode('值得读的研究'));const more=node('a','全部报告');more.href='#reports';more.append(icon('arrow'));head.append(title,more);reportBox.append(head);
 for(const item of items.filter(a=>a.section==='reports').slice(0,2))reportBox.append(compactReport(item));
 if(reportData.status==='error'){const status=node('p',null,'home-report-status');status.append(node('span',null,'status-dot'),document.createTextNode('部分来源待核验 · 上次完整更新 '+reportData.lastSuccess));reportBox.append(status)}list.append(reportBox);
 const side=node('div',null,'home-side'),health=pick('health');if(health)side.append(makeFeature(health,'health'));side.append(makeCaseFeature());list.append(side);
 $('load-more').hidden=true;$('sources').hidden=true;
}
$('filter-toggle').onclick=()=>{filterOpen=!filterOpen;if(filterOpen&&homeMode==='featured'){homeMode='latest';history.replaceState(null,'','#home/latest')}render()};

navigate();
