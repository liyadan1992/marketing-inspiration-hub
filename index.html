const communityKey='marketing-community-v1';let communityItems=[];let communityEditing=null;try{const savedCommunity=JSON.parse(localStorage.getItem(communityKey)||'[]');if(Array.isArray(savedCommunity))communityItems=savedCommunity}catch{}
function saveCommunity(){try{localStorage.setItem(communityKey,JSON.stringify(communityItems))}catch{toast('浏览器无法保存社群内容，本次更改仅在当前页面有效。')}}
function resetCommunityForm(){communityEditing=null;el('community-form').reset();el('community-form-title').textContent='新增运营内容';el('community-cancel').hidden=true}
function editCommunity(id){const item=communityItems.find(x=>x.id===id);if(!item)return;communityEditing=id;el('community-title').value=item.title;el('community-channel').value=item.channel;el('community-status').value=item.status;el('community-content').value=item.content;el('community-form-title').textContent='修改运营内容';el('community-cancel').hidden=false;el('community-title').focus();window.scrollTo({top:0,behavior:'smooth'})}
function renderCommunity(){el('community-count').textContent='· '+communityItems.length+' 条';el('community-list').replaceChildren();if(!communityItems.length){el('community-list').append(node('div','还没有社群运营内容。\n在左侧表单中创建第一条内容。','community-empty'));return}for(const item of communityItems){const card=node('article',null,'community-item'),head=node('div',null,'community-item-head'),title=node('h3',item.title),actions=node('div',null,'community-item-actions'),edit=node('button','修改'),del=node('button','删除');edit.type='button';edit.onclick=()=>editCommunity(item.id);del.type='button';del.onclick=()=>{if(!confirm('删除这条社群运营内容？'))return;communityItems=communityItems.filter(x=>x.id!==item.id);if(communityEditing===item.id)resetCommunityForm();saveCommunity();renderCommunity()};actions.append(edit,del);head.append(title,actions);const meta=node('div',null,'community-meta');meta.append(node('span',item.channel,'community-tag'),node('span',item.status,'community-tag'),node('span','更新于 '+item.updated,'community-tag'));card.append(head,meta,node('p',item.content,'community-content'));el('community-list').append(card)}}
el('community-form').onsubmit=e=>{e.preventDefault();const data={title:el('community-title').value.trim(),channel:el('community-channel').value,status:el('community-status').value,content:el('community-content').value.trim(),updated:new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date())};if(!data.title||!data.content)return;const wasEditing=!!communityEditing;if(communityEditing){const index=communityItems.findIndex(x=>x.id===communityEditing);if(index>=0)communityItems[index]={...communityItems[index],...data}}else communityItems.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),...data});saveCommunity();resetCommunityForm();renderCommunity();toast(wasEditing?'内容已更新':'内容已保存')};el('community-cancel').onclick=resetCommunityForm;
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-section]').forEach(x=>{const selected=x===b;x.classList.toggle('active',selected);if(selected)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});for(const name of ['inspiration','reports','daily','community'])el(name+'-panel').hidden=name!==b.dataset.section;if(b.dataset.section==='daily')renderWork();if(b.dataset.section==='community')renderCommunity();window.scrollTo(0,0)});renderWork();renderCommunity();
</script></body></html>
