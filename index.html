function workDay(){const date=el('work-date').value||localToday();if(!workdays[date]||typeof workdays[date]!=='object')workdays[date]={tasks:[],notes:''};const d=workdays[date];if(!Array.isArray(d.tasks))d.tasks=[];if(typeof d.notes!=='string')d.notes='';return d}
function saveWork(){try{localStorage.setItem(workKey,JSON.stringify(workdays));el('save-status').textContent='已保存到当前浏览器 · 不跨设备同步'}catch{el('save-status').textContent='保存失败，请先复制工作记录以免丢失。'}}
function renderWork(){const d=workDay();el('work-count').textContent=d.tasks.filter(t=>t.done).length+' / '+d.tasks.length+' 已完成';el('task-list').replaceChildren();for(const t of d.tasks){const row=node('div',null,'task-row'+(t.done?' done':''));const box=node('input');box.type='checkbox';box.checked=!!t.done;box.id='task-'+t.id;const label=node('label',t.text);label.htmlFor=box.id;box.onchange=()=>{t.done=box.checked;saveWork();renderWork()};const del=node('button','移除','remove-task');del.type='button';del.setAttribute('aria-label','移除工作：'+t.text);del.onclick=()=>{if(!confirm('移除这项工作记录？'))return;d.tasks=d.tasks.filter(x=>x.id!==t.id);saveWork();renderWork()};row.append(box,label,del);el('task-list').append(row)}if(!d.tasks.length)el('task-list').append(node('p','这一天还没有工作记录。','daily-empty'));el('work-notes').value=d.notes}
el('task-form').onsubmit=e=>{e.preventDefault();const text=el('task-input').value.trim();if(!text)return;workDay().tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),text,done:false});el('task-input').value='';saveWork();renderWork();el('task-input').focus()};el('work-notes').oninput=()=>{workDay().notes=el('work-notes').value;saveWork()};el('work-date').onchange=()=>{if(!el('work-date').value)el('work-date').value=localToday();el('save-status').textContent='记录仅保存在当前浏览器。';renderWork()};
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-section]').forEach(x=>{const selected=x===b;x.classList.toggle('active',selected);if(selected)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});for(const name of ['inspiration','reports','daily'])el(name+'-panel').hidden=name!==b.dataset.section;if(b.dataset.section==='daily')renderWork();window.scrollTo(0,0)});renderWork();
</script></body></html>
